mqtt:
  enabled: true
  host: 192.168.0.15
  user: frigate
  password: '{FRIGATE_MQTT_PASSWORD}'

ffmpeg:
  hwaccel_args: preset-vaapi

# Global recording & retention policy across all cameras
record:
  enabled: true
  alerts:
    retain:
      days: 14
      mode: motion
  detections:
    retain:
      days: 14
objects:
  track:
    - person
    - car
    - dog
    - cat

# go2rtc restreaming engine (handles stream multiplexing and WebRTC)
go2rtc:
  streams:
    garage_main:
      - rtsp://admin:{FRIGATE_NVR_PASSWORD}@{FRIGATE_NVR_IP}:554/Streaming/Channels/101
    garage_sub:
      - rtsp://admin:{FRIGATE_NVR_PASSWORD}@{FRIGATE_NVR_IP}:554/Streaming/Channels/102
    hvac_main:
      - rtsp://admin:{FRIGATE_NVR_PASSWORD}@{FRIGATE_NVR_IP}:554/Streaming/Channels/201
    hvac_sub:
      - rtsp://admin:{FRIGATE_NVR_PASSWORD}@{FRIGATE_NVR_IP}:554/Streaming/Channels/202
    pool_main:
      - rtsp://admin:{FRIGATE_NVR_PASSWORD}@{FRIGATE_NVR_IP}:554/Streaming/Channels/301
    pool_sub:
      - rtsp://admin:{FRIGATE_NVR_PASSWORD}@{FRIGATE_NVR_IP}:554/Streaming/Channels/302
    fpl_main:
      - rtsp://admin:{FRIGATE_NVR_PASSWORD}@{FRIGATE_NVR_IP}:554/Streaming/Channels/401
    fpl_sub:
      - rtsp://admin:{FRIGATE_NVR_PASSWORD}@{FRIGATE_NVR_IP}:554/Streaming/Channels/402
    family_main:
      - rtsp://admin:{FRIGATE_AMCREST_PASSWORD}@192.168.0.120:554/cam/realmonitor?channel=1&subtype=0
    family_sub:
      - rtsp://admin:{FRIGATE_AMCREST_PASSWORD}@192.168.0.120:554/cam/realmonitor?channel=1&subtype=1

cameras:
  garage:
    ffmpeg:
      inputs:
        # - path: rtsp://127.0.0.1:8554/garage_main
        #   roles:
        #     - record
        - path: rtsp://127.0.0.1:8554/garage_sub
          roles:
            - detect
    detect:
      enabled: true
      width: 352
      height: 240
      fps: 5
    record:
      enabled: false
    snapshots:
      enabled: true

  hvac:
    ffmpeg:
      inputs:
        # - path: rtsp://127.0.0.1:8554/hvac_main
        #   roles:
        #     - record
        - path: rtsp://127.0.0.1:8554/hvac_sub
          roles:
            - detect
    detect:
      enabled: true
      width: 352
      height: 240
      fps: 5
    record:
      enabled: false
    snapshots:
      enabled: true

  pool:
    ffmpeg:
      inputs:
        # - path: rtsp://127.0.0.1:8554/pool_main
        #   roles:
        #     - record
        - path: rtsp://127.0.0.1:8554/pool_sub
          roles:
            - detect
    detect:
      enabled: true
      width: 352
      height: 240
      fps: 5
    record:
      enabled: false
    snapshots:
      enabled: true

  fpl:
    ffmpeg:
      inputs:
        # - path: rtsp://127.0.0.1:8554/fpl_main
        #   roles:
        #     - record
        - path: rtsp://127.0.0.1:8554/fpl_sub
          roles:
            - detect
    detect:
      enabled: true
      width: 352
      height: 240
      fps: 5
    record:
      enabled: false
    snapshots:
      enabled: true

  family:
      ffmpeg:
        inputs:
          - path: rtsp://127.0.0.1:8554/family_main
            roles:
              - record
          - path: rtsp://127.0.0.1:8554/family_sub
            roles:
              - detect
      detect:
        enabled: true
        width: 704
        height: 480
        fps: 5

version: 0.17-0
